[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "checklock"
version = "0.1.0"
description = "Detect GitHub Actions required-check deadlocks before they block a merge."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Checklock contributors" }]
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
checklock = "checklock.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/checklock"]
